# 金铲铲之战 — 归一化 ROI 定义
# 所有值均为归一化坐标 [0.0-1.0]，(left, top, right, bottom)
# 基于 1440x3200 分辨率设备实测
# 格式: [left, top, right, bottom] — 与代码中 tuple 格式一致

# ── 状态检测 ROI ───────────────────────────────────────────────────────
state_detection:
  lobby_play_btn:    [0.35, 0.82, 0.65, 0.93]
  loading_indicator: [0.40, 0.38, 0.60, 0.55]
  planning_timer:    [0.44, 0.00, 0.56, 0.06]
  combat_indicator:  [0.00, 0.00, 0.18, 0.08]
  result_rank:       [0.30, 0.10, 0.70, 0.40]   # 结算排名区域

# ── 基础信息 OCR ROI ────────────────────────────────────────────────────
info:
  gold:        [0.02, 0.89, 0.10, 0.95]   # 金币数
  level:       [0.02, 0.02, 0.08, 0.07]   # 等级
  hp:          [0.86, 0.02, 0.98, 0.07]   # 血量
  round_timer: [0.44, 0.00, 0.56, 0.06]   # 剩余秒数
  stage_text:  [0.40, 0.00, 0.60, 0.06]   # 回合文本（如 "3-5"）

# ── 商店区域 ROI ────────────────────────────────────────────────────────
# 5 个商店 slot，从左到右排列在屏幕底部
shop:
  refresh_btn: [0.88, 0.66, 0.95, 0.72]   # 刷新按钮
  buy_xp_btn:  [0.88, 0.74, 0.95, 0.80]   # 购买经验
  slots:
    # 每个 slot 包含棋子头像 + 名称文字区域
    - [0.06, 0.65, 0.22, 0.96]   # slot 0
    - [0.24, 0.65, 0.40, 0.96]   # slot 1
    - [0.42, 0.65, 0.58, 0.96]   # slot 2
    - [0.60, 0.65, 0.76, 0.96]   # slot 3
    - [0.78, 0.65, 0.94, 0.96]   # slot 4

# ── 备战席区域 ROI ──────────────────────────────────────────────────────
# 9 个备战席 slot，屏幕下半部分
bench: [0.04, 0.80, 0.96, 0.90]

# ── 棋盘区域 ROI ────────────────────────────────────────────────────────
board:
  # 4 行 x 7 列的战斗棋盘
  full:  [0.05, 0.28, 0.95, 0.62]
  rows:
    - [0.05, 0.28, 0.95, 0.36]   # 前排 (row 0)
    - [0.05, 0.36, 0.95, 0.44]   # row 1
    - [0.05, 0.44, 0.95, 0.52]   # row 2
    - [0.05, 0.52, 0.95, 0.62]   # 后排 (row 3)

# ── UI 按钮 ROI ─────────────────────────────────────────────────────────
buttons:
  back:     [0.01, 0.01, 0.05, 0.06]   # 返回按钮
  settings: [0.92, 0.01, 0.98, 0.06]   # 设置按钮

# ── 战斗中 ROI ──────────────────────────────────────────────────────────
combat:
  round_indicator: [0.40, 0.00, 0.60, 0.06]   # 回合/阶段文字
