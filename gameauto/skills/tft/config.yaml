# 金铲铲之战 — S16「英雄联盟传奇」游戏参数 & 阵容配置
# 可通过 ~/.gameauto/games/tft.yaml 覆盖
#
# 阵容: 德玛西亚琴女（1费赌狗，T0 梯队）
# 核心: 7德玛西亚 + 2护卫 + 2神谕者 + 2主宰 + 2法师 + 2神盾使
# 运营: 2-1不升级 → 5级慢D追三星娑娜 → 上8开7德玛 → 9级大成

# ── 循环控制 ──────────────────────────────────────────────────────────
rounds: 500              # 最大轮数（一局 ~30-40 轮）
max_steps_per_round: 6   # 每轮最多操作数（买子+升人口+站位）

# ── 策略配置 ──────────────────────────────────────────────────────────
strategy:
  type: "德玛西亚琴女"       # 1费赌狗：停在5级慢D三星娑娜
  description: >
    S16英雄联盟传奇最强1费赌狗。2-1不升级攒经济，3-1开D追三星娑娜(琴女)，
    琴女三星后冲8级开7德玛西亚。前四率>96%, 吃鸡率>92%。

  # 经济
  interest_threshold: 50     # 始终保持50金吃利息
  reroll_above: 50           # 超过50金的部分用于刷新
  hp_desperation: 30         # 血量低于此值进入濒死模式（激进花钱）

  # 等级（德玛琴女特殊运营：2-1不升级！）
  # 仅在琴女三星后开始升人口
  target_level: 9            # 不设硬上限，由 level_schedule 控制节奏
  slow_roll_level: 5          # D牌等级（5级慢D追三星娑娜）
  level_schedule:            # 固定升级时间表
    "3-5": 6                 # 琴女三星后 → 6级
    "4-2": 7                 # → 7级
    "4-5": 8                 # → 8级开7德玛西亚
    "5-5": 9                 # → 9级大成

  # 核心棋子池（按购买优先级从高到低）
  # 1-2费赌狗: 前期只买1-2费棋子，4费以上后期才考虑
  core_champions:

    # ── 必追三星（主C/主坦）──
    - name: "娑娜"           # ★ 主C — 1费琴女
      cost: 1
      target_stars: 3
      role: "carry"

    - name: "嘉文四世"       # 皇子 — 1费副坦/工具人
      cost: 1
      target_stars: 3
      role: "tank"

    - name: "波比"           # 2费护卫前排
      cost: 2
      target_stars: 3
      role: "tank"

    - name: "赵信"           # 2费前排
      cost: 2
      target_stars: 3
      role: "tank"

    # ── 后期补强（4费，不追三，2星即可）──
    - name: "盖伦"           # 4费主坦 — 德玛西亚核心
      cost: 4
      target_stars: 2
      role: "tank"

    - name: "拉克丝"         # 4费副C
      cost: 4
      target_stars: 2
      role: "carry"

    # ── 过渡棋子（来了就买）──
    - name: "斯维因"         # 3费 — 乌鸦，提供主宰+法师
      cost: 3
      target_stars: 2
      role: "tank"

    - name: "薇恩"           # 3费 — 提供神谕者
      cost: 3
      target_stars: 2
      role: "carry"

  # ── 扩展棋子池（阵容完整名单，用于棋盘识别）──
  bench_champions:
    # 德玛西亚体系完整阵容 (9人口大成)
    - "娑娜"       # 1费 主C
    - "嘉文四世"   # 1费 副坦
    - "波比"       # 2费 护卫
    - "赵信"       # 2费 前排
    - "斯维因"     # 3费 主宰+法师
    - "盖伦"       # 4费 主坦
    - "拉克丝"     # 4费 副C
    - "加里奥"     # 5费 (解锁条件: 德玛棋子12星)
    - "奥恩"       # 5费 神谕

  # ── 棋子角色分类（站位用）──
  champion_roles:
    tank:
      - "嘉文四世"
      - "波比"
      - "赵信"
      - "盖伦"
      - "斯维因"
    carry:
      - "娑娜"
      - "拉克丝"
      - "薇恩"

  # ── 羁绊（用于阵容识别）──
  synergies:
    primary: "德玛西亚"       # 主羁绊
    secondary:
      - "护卫"
      - "神谕者"
      - "主宰"
      - "法师"
      - "神盾使"

# ── 感知配置 ──────────────────────────────────────────────────────────
perception:
  ocr:
    lang: "ch"
    threshold: 0.5          # OCR 置信度最低阈值
  template_match:
    threshold: 0.75          # 模板匹配置信度阈值

# ── 延迟配置（毫秒）─────────────────────────────────────────────────────
timing:
  round_interval: 1.0        # 轮间等待（秒）
  action_interval: 0.3       # 操作间等待（秒）
  loading_timeout: 300       # 排队超时（秒）
  loading_check_interval: 3.0  # 排队时检查间隔（秒）
