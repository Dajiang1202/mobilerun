[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "gameauto"
version = "0.1.0"
description = "GameAuto Framework — 移动端游戏自动化框架"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.0",
]

[project.scripts]
gameauto-match3 = "run_match3:main"
gameauto-doudizhu = "run_doudizhu:main"

[tool.setuptools.packages.find]
where = ["."]
