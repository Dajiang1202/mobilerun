# GameAuto Framework — Global defaults (shared by all games)
# DO NOT put secrets here. Edit ~/.gameauto/settings.yaml
# Game-specific params go in skills/<game>/config.yaml

device:
  serial: null
  hdc_path: hdc
  screenshot_method: auto

vlm:
  model: gpt-4o
  base_url: ""
  api_key: ""
  # Image preprocessing (controls token cost for vision models)
  image:
    max_side: 1024      # resize so longest edge ≤ N pixels (0 = no resize)
    detail: auto         # OpenAI detail: "low" (85 tokens) / "high" / "auto"

perception:
  prompt_path: skills/match3/prompts/generic.jinja2

logging:
  console_level: INFO
